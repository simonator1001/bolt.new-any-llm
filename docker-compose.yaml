services:
  bolt-ai:
    build:
      context: .
      dockerfile: Dockerfile
      target: bolt-ai-production
      args:
        - NODE_ENV=production
    ports:
      - "443:5173"
    environment:
      - NODE_ENV=production
      - PORT=5173
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - OLLAMA_API_BASE_URL=${OLLAMA_API_BASE_URL}
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
    command: npm run dockerstart
    restart: unless-stopped
    networks:
      - coolify-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bolt.rule=Host(`bolt.simon-ai.com`)"
      - "traefik.http.routers.bolt.entrypoints=websecure"
      - "traefik.http.routers.bolt.tls=true"
      - "traefik.http.routers.bolt.tls.certresolver=letsencrypt"
      - "traefik.http.services.bolt.loadbalancer.server.port=5173"

networks:
  coolify-network:
    external: true
